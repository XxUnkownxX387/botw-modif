name: Build APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK and CMake
        run: |
          echo "y" | sdkmanager "ndk;30.0.16248370" "cmake;3.30.4" "platforms;android-30" "platforms;android-36"

      - name: Build dependencies
        run: |
          bash android/deps/build_deps.sh
          bash android/deps/build_gen_deps.sh

      - name: Build APK with Gradle
        run: |
          cd android/botwrecompandroid
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: botwrecompandroid-arm64-v8a
          path: android/botwrecompandroid/app/build/outputs/apk/**/*.apk
